[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auraconstruct"
version = "0.1.0"
description = "DNA sequence files to SBOL Visual construct illustrations and editable PowerPoint modules"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aureka"}]
dependencies = ["biopython>=1.85,<2", "flask>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
auraconstruct = "auraconstruct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auraconstruct = ["web/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
